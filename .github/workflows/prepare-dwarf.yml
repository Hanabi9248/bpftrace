name: Prepare validated DWARF contribution
on:
  push:
    branches: [codex/prepare-dwarf]
    paths: [.github/workflows/prepare-dwarf.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ecca8a082b91e05f99e0b71ee9beec47f2527096
      - name: Publish the verified tree as one signed-off commit
        env:
          PATCH_BASE64: ""
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Hanabi9248/bpftrace
          test -z "$(git ls-remote --heads origin refs/heads/codex/dwarf-parameter-names)"
          printf '%s' "$PATCH_BASE64" | base64 --decode > /tmp/dwarf.patch
          git apply --index /tmp/dwarf.patch
          test "$(git write-tree)" = 96957ac3572bd89e678d62799af0bc46f30d0c69
          git -c user.name='Hanabi Misaka' -c user.email=hanabi210902@gmail.com commit --signoff -m 'Resolve inherited DWARF parameter names'
          test "$(git rev-parse HEAD^)" = ecca8a082b91e05f99e0b71ee9beec47f2527096
          git push origin HEAD:refs/heads/codex/dwarf-parameter-names
